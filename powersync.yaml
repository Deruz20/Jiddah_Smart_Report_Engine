port: 8080

client_auth:
  jwks_uri: https://vismrobdsdsaxmqegcay.supabase.co/auth/v1/.well-known/jwks.json
  audience: ['authenticated']

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI

storage:
  type: postgresql
  uri: !env PS_PG_URI



sync_config:
  content: |
    config:
      edition: 3

    with:
      my_homeroom_classes:
        SELECT id AS class_id FROM circular_classes WHERE class_teacher_id IN (SELECT id FROM teachers WHERE auth_user_id = auth.user_id())

      my_assigned_circular_classes:
        SELECT class_id FROM teacher_class_assignments WHERE teacher_id IN (SELECT id FROM teachers WHERE auth_user_id = auth.user_id()) AND class_type = 'circular'

      my_assigned_theology_classes:
        SELECT class_id FROM teacher_class_assignments WHERE teacher_id IN (SELECT id FROM teachers WHERE auth_user_id = auth.user_id()) AND class_type = 'theology'

    streams:
      my_profile:
        auto_subscribe: true
        query: SELECT * FROM teachers WHERE auth_user_id = auth.user_id()

      subjects_ref:
        auto_subscribe: true
        query: SELECT * FROM subjects

      circular_classes_assigned:
        auto_subscribe: true
        query: |
          SELECT * FROM circular_classes
          WHERE id IN (SELECT class_id FROM my_assigned_circular_classes)
             OR id IN (SELECT class_id FROM my_homeroom_classes)

      theology_classes_assigned:
        auto_subscribe: true
        query: SELECT * FROM theology_classes WHERE id IN (SELECT class_id FROM my_assigned_theology_classes)

      enrollments_assigned:
        auto_subscribe: true
        query: |
          SELECT * FROM enrollments
          WHERE circular_class_id IN (SELECT class_id FROM my_assigned_circular_classes)
             OR circular_class_id IN (SELECT class_id FROM my_homeroom_classes)
             OR theology_class_id IN (SELECT class_id FROM my_assigned_theology_classes)

      students_assigned:
        auto_subscribe: true
        query: |
          SELECT * FROM students
          WHERE id IN (
            SELECT student_id FROM enrollments
            WHERE circular_class_id IN (SELECT class_id FROM my_assigned_circular_classes)
               OR circular_class_id IN (SELECT class_id FROM my_homeroom_classes)
               OR theology_class_id IN (SELECT class_id FROM my_assigned_theology_classes)
          )

      circular_marks_assigned:
        auto_subscribe: true
        query: |
          SELECT cm.* FROM circular_marks cm
          WHERE cm.enrollment_id IN (
            SELECT id FROM enrollments
            WHERE circular_class_id IN (SELECT class_id FROM my_assigned_circular_classes)
               OR circular_class_id IN (SELECT class_id FROM my_homeroom_classes)
          )

      theology_marks_assigned:
        auto_subscribe: true
        query: |
          SELECT tm.* FROM theology_marks tm
          WHERE tm.enrollment_id IN (
            SELECT id FROM enrollments
            WHERE theology_class_id IN (SELECT class_id FROM my_assigned_theology_classes)
               OR circular_class_id IN (SELECT class_id FROM my_homeroom_classes)
          )

      activity_log_assigned:
        auto_subscribe: true
        query: SELECT * FROM activity_log WHERE teacher_id = auth.user_id()

      grading_standards_ref:
        auto_subscribe: true
        query: SELECT * FROM grading_standards

      report_templates_ref:
        auto_subscribe: true
        query: SELECT * FROM report_templates

      exam_types_ref:
        auto_subscribe: true
        query: SELECT * FROM exam_types

      special_exam_marks_assigned:
        auto_subscribe: true
        query: |
          SELECT sm.* FROM special_exam_marks sm
          WHERE sm.enrollment_id IN (
            SELECT id FROM enrollments
            WHERE circular_class_id IN (SELECT class_id FROM my_assigned_circular_classes)
               OR circular_class_id IN (SELECT class_id FROM my_homeroom_classes)
               OR theology_class_id IN (SELECT class_id FROM my_assigned_theology_classes)
          )
