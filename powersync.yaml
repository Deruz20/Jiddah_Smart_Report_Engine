port: 8080

client_auth:
  jwks_uri: https://vismrobdsdsaxmqegcay.supabase.co/auth/v1/.well-known/jwks.json
  audience: ['authenticated']

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_PG_URI
  sslmode: disable



sync_config:
  content: |
    config:
      edition: 3

    with:
      my_teacher:
        SELECT id, role FROM teachers WHERE auth_user_id = auth.user_id()

      my_homeroom_classes:
        SELECT id AS class_id FROM circular_classes
        WHERE class_teacher_id IN (SELECT id FROM my_teacher)

      my_assigned_circular_classes:
        SELECT id AS class_id FROM circular_classes
        WHERE class_teacher_id IN (SELECT id FROM my_teacher)
          OR id IN (SELECT class_id FROM teacher_class_assignments WHERE teacher_id IN (SELECT id FROM my_teacher) AND class_type = 'circular')

      my_admin_circular_classes:
        SELECT circular_classes.id AS class_id FROM circular_classes, my_teacher
        WHERE my_teacher.role IN ('DOS Secular','Administrator','admin','Head Teacher','Deputy Head Teacher')

      my_assigned_theology_classes:
        SELECT id AS class_id FROM theology_classes
        WHERE id IN (SELECT class_id FROM teacher_class_assignments WHERE teacher_id IN (SELECT id FROM my_teacher) AND class_type = 'theology')

      my_admin_theology_classes:
        SELECT theology_classes.id AS class_id FROM theology_classes, my_teacher
        WHERE my_teacher.role IN ('DOS Theology','Administrator','admin','Head Teacher','Deputy Head Teacher')

    streams:
      my_profile:
        auto_subscribe: true
        query: SELECT * FROM teachers WHERE auth_user_id = auth.user_id()

      subjects_ref:
        auto_subscribe: true
        query: SELECT * FROM subjects

      my_circular_classes_stream:
        auto_subscribe: true
        query: |
          SELECT * FROM circular_classes
          WHERE id IN (SELECT class_id FROM my_assigned_circular_classes)
             OR id IN (SELECT class_id FROM my_admin_circular_classes)

      my_theology_classes_stream:
        auto_subscribe: true
        query: |
          SELECT * FROM theology_classes
          WHERE id IN (SELECT class_id FROM my_assigned_theology_classes)
             OR id IN (SELECT class_id FROM my_admin_theology_classes)

      my_enrollments:
        auto_subscribe: true
        query: |
          SELECT * FROM enrollments
          WHERE circular_class_id IN (SELECT class_id FROM my_assigned_circular_classes)
             OR circular_class_id IN (SELECT class_id FROM my_admin_circular_classes)
             OR theology_class_id IN (SELECT class_id FROM my_assigned_theology_classes)
             OR theology_class_id IN (SELECT class_id FROM my_admin_theology_classes)

      my_students:
        auto_subscribe: true
        query: |
          SELECT * FROM students
          WHERE id IN (
            SELECT student_id FROM enrollments
            WHERE circular_class_id IN (SELECT class_id FROM my_assigned_circular_classes)
               OR circular_class_id IN (SELECT class_id FROM my_admin_circular_classes)
               OR theology_class_id IN (SELECT class_id FROM my_assigned_theology_classes)
               OR theology_class_id IN (SELECT class_id FROM my_admin_theology_classes)
          )

      my_circular_marks:
        auto_subscribe: true
        query: |
          SELECT cm.* FROM circular_marks cm
          WHERE cm.enrollment_id IN (
            SELECT id FROM enrollments
            WHERE circular_class_id IN (SELECT class_id FROM my_assigned_circular_classes)
               OR circular_class_id IN (SELECT class_id FROM my_admin_circular_classes)
          )

      my_theology_marks:
        auto_subscribe: true
        query: |
          SELECT tm.* FROM theology_marks tm
          WHERE tm.enrollment_id IN (
            SELECT id FROM enrollments
            WHERE theology_class_id IN (SELECT class_id FROM my_assigned_theology_classes)
               OR theology_class_id IN (SELECT class_id FROM my_admin_theology_classes)
               OR circular_class_id IN (SELECT class_id FROM my_homeroom_classes)
          )
